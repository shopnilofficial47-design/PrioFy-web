<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priofy Live Sports</title>
    
    <!-- Player Libraries (HLS & DASH) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <script src="https://cdn.dashjs.org/v4.7.1/dash.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #0b0f12; --card: #141a1f; --green: #2cb36a; --text: #fff; --muted: #88929e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; padding: 15px; background: var(--bg); align-items: center; border-bottom: 1px solid #1e2933; }
        .logo { font-size: 24px; font-weight: bold; font-style: italic; color: #fff; }
        .icons i { font-size: 18px; margin-left: 15px; cursor: pointer; color: #fff; }
        
        /* Category & Filters */
        .scroll-row { display: flex; overflow-x: auto; gap: 10px; padding: 15px; }
        .scroll-row::-webkit-scrollbar { display: none; }
        .cat-box { text-align: center; min-width: 60px; cursor: pointer; position: relative;}
        .cat-icon { width: 45px; height: 45px; background: #1f272d; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; border: 2px solid transparent;}
        .cat-box.active .cat-icon { border-color: var(--green); color: #fff; }
        .cat-box i { color: var(--muted); font-size: 18px; }
        .cat-box.active i { color: #fff; }
        .cat-name { font-size: 12px; color: var(--muted); font-weight: bold;}
        .cat-box.active .cat-name { color: #fff; }
        .badge { position: absolute; top: -5px; right: 0; background: #e74c3c; padding: 2px 5px; border-radius: 10px; font-size: 10px; font-weight: bold;}
        
        .filter-btn { background: #1f272d; color: var(--muted); border: none; padding: 6px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap;}
        .filter-btn.active { background: #183d2e; border: 1px solid #1a6b46; color: #fff; }
        
        /* Event Cards */
        .container { padding: 0 15px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card); border: 1px solid #1a6b46; border-radius: 10px; padding: 15px; cursor: pointer; }
        .card-title { text-align: center; font-size: 11px; margin-bottom: 15px; font-weight: bold; color: var(--text); }
        .card-title i { color: var(--green); }
        .match-row { display: flex; justify-content: space-between; align-items: center; }
        .team { width: 33%; text-align: center; }
        .team img { width: 45px; height: 45px; border-radius: 50%; background: #fff; padding: 2px; margin-bottom: 5px; object-fit: contain;}
        .team-name { font-size: 12px; font-weight: bold; }
        
        .status { width: 33%; text-align: center; }
        .time { font-size: 16px; font-weight: bold; color: #08C7D6; }
        .date { font-size: 10px; color: var(--muted); margin: 3px 0; }
        .status-btn { background: rgba(44,179,106,0.15); color: var(--green); padding: 3px 10px; border-radius: 15px; font-size: 10px; font-weight: bold; display: inline-block;}
        .status-live { background: rgba(219,68,55,0.15); color: #db4437; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Stream Links (Hidden by default) */
        .streams { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #1e2933; flex-wrap: wrap; gap: 10px; }
        .stream-link { flex: 1 1 calc(50% - 5px); background: #1f272d; color: #fff; text-align: center; padding: 10px; border-radius: 5px; font-size: 12px; font-weight: bold; border-left: 3px solid var(--green); transition: 0.2s;}
        .stream-link:hover { background: var(--green); color: #000; }
        
        /* Modal Video Player */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: var(--card); width: 100%; max-width: 600px; border-radius: 10px; overflow: hidden; border: 1px solid var(--green); }
        .modal-header { display: flex; justify-content: space-between; padding: 15px; background: var(--bg); }
        .modal-header h3 { font-size: 14px; }
        .close-btn { color: #e74c3c; cursor: pointer; font-size: 18px; }
        video { width: 100%; max-height: 400px; display: block; background: #000; }
        
        /* Botom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--bg); border-top: 1px solid #1e2933; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;}
        .nav-item { text-align: center; color: var(--muted); font-size: 10px; }
        .nav-item i { font-size: 18px; margin-bottom: 3px; display: block;}
        .nav-item.active { color: var(--green); }

        #debug-log { text-align: center; padding: 50px 20px; color: var(--green); font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex; align-items:center; gap:15px;">
            <i class="fas fa-bars"></i> <div class="logo">priofy</div>
        </div>
        <div class="icons">
            <i class="fas fa-bell"></i>
            <i class="fas fa-sync-alt" onclick="initApp()"></i>
        </div>
    </div>

    <!-- Category & Filter UI -->
    <div class="scroll-row" id="cat-container"></div>
    <div class="scroll-row" style="padding-top:0;">
        <button class="filter-btn active" onclick="setFilter('All', this)">✓ All</button>
        <button class="filter-btn" onclick="setFilter('Live', this)">Live</button>
        <button class="filter-btn" onclick="setFilter('Upcoming', this)">Upcoming</button>
    </div>

    <!-- Main Cards -->
    <div class="container" id="events-container">
        <div id="debug-log"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>ডেটা লোড হচ্ছে...</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item"><i class="fas fa-film"></i>Movies</div>
        <div class="nav-item"><i class="fas fa-tv"></i>TV Mode</div>
        <div class="nav-item active"><i class="fas fa-futbol"></i>Live Events</div>
        <div class="nav-item"><i class="fas fa-satellite-dish"></i>Live TV</div>
    </div>

    <!-- Player Modal -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="player-title">Live Stream</h3>
                <i class="fas fa-times close-btn" onclick="closePlayer()"></i>
            </div>
            <video id="video-element" controls autoplay playsinline></video>
            <div id="player-error" style="color:#e74c3c; text-align:center; padding:10px; display:none; font-size:12px;"></div>
        </div>
    </div>

    <script>
        const API_EVENTS = 'https://ratulxadia-playz-cats-event.hf.space/api/events';
        const API_STREAMS = 'https://adiaxratul-playz-link-send.hf.space/api/live-stream';

        let eventsData = [];
        let streamsData = {};
        let activeCat = 'All';
        let activeFilter = 'All';
        
        let hlsObj = null;
        let dashObj = null;

        // ডেটা ফেইল করলে যাতে প্রক্সি হয়ে আসে (CORS Safe)
        async function fetchJSON(url) {
            try {
                let res = await fetch(url);
                return await res.json();
            } catch(e) {
                let pRes = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
                return await pRes.json();
            }
        }

        async function initApp() {
            const container = document.getElementById('events-container');
            container.innerHTML = '<div id="debug-log"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>ডেটা লোড হচ্ছে...</div>';
            
            try {
                // ১. API কল 
                const evRes = await fetchJSON(API_EVENTS);
                const stRes = await fetchJSON(API_STREAMS);

                // ২. ডেটা ভেরিফাই
                eventsData = Array.isArray(evRes) ? evRes.filter(i => i.event && i.event.visible) : [];
                streamsData = stRes || {};

                renderCategories();
                renderCards();
            } catch (err) {
                container.innerHTML = `<div id="debug-log" style="color:#e74c3c;">
                    <i class="fas fa-exclamation-triangle fa-2x"></i><br><br>
                    ডেটা ফেচ করতে সমস্যা হয়েছে!<br>API সার্ভার ডাউন থাকতে পারে।
                </div>`;
            }
        }

        // ক্যাটাগরি তৈরি
        function renderCategories() {
            let catCount = { 'All': eventsData.length };
            eventsData.forEach(item => {
                let c = item.event.category || 'Others';
                catCount[c] = (catCount[c] || 0) + 1;
            });

            const icons = { 'Cricket': 'fa-cricket', 'Football': 'fa-futbol', 'WWE': 'fa-khanda', 'Racing': 'fa-flag-checkered', 'Baseball': 'fa-baseball', 'Basketball': 'fa-basketball' };
            
            let html = `<div class="cat-box ${activeCat === 'All' ? 'active' : ''}" onclick="setCat('All')">
                            <div class="badge">${catCount['All']}</div>
                            <div class="cat-icon"><i class="fas fa-globe"></i></div>
                            <div class="cat-name">All</div>
                        </div>`;
            
            Object.keys(catCount).forEach(key => {
                if(key !== 'All') {
                    html += `<div class="cat-box ${activeCat === key ? 'active' : ''}" onclick="setCat('${key}')">
                                <div class="badge">${catCount[key]}</div>
                                <div class="cat-icon"><i class="fas ${icons[key] || 'fa-trophy'}"></i></div>
                                <div class="cat-name">${key}</div>
                            </div>`;
                }
            });
            document.getElementById('cat-container').innerHTML = html;
        }

        function setCat(cat) { activeCat = cat; renderCategories(); renderCards(); }
        
        function setFilter(type, btn) {
            activeFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => { b.classList.remove('active'); b.innerText = b.innerText.replace('✓ ', ''); });
            btn.classList.add('active'); btn.innerText = '✓ ' + type;
            renderCards();
        }

        // মূল কার্ড রেন্ডার (JSON স্ট্রাকচার ধরে নিখুঁত ম্যাপিং)
        function renderCards() {
            let html = '';
            
            eventsData.forEach(item => {
                const ev = item.event;
                
                // ফিল্টার চেক
                if(activeCat !== 'All' && ev.category !== activeCat) return;

                // টাইম লজিক (Error Safe)
                let timeState = 'upcoming', timeText = 'Upcoming', timeShow = ev.time || 'TBA';
                try {
                    let d = (ev.date||'').split('/'), t = (ev.time||'').split(':');
                    if(d.length===3 && t.length>=2) {
                        let diff = new Date(`${d[2]}-${d[1]}-${d[0]}T${t[0]}:${t[1]}:00`) - new Date();
                        if(diff <= 0 && diff > -10800000) { timeState = 'live'; timeText = '🔴 LIVE'; }
                        else if(diff > 0) { timeText = Math.floor(diff/60000) < 60 ? `${Math.floor(diff/60000)}m left` : `${Math.floor(diff/3600000)}h left`; }
                        else { timeState = 'finished'; timeText = 'Finished'; }
                        
                        let h = parseInt(t[0]);
                        timeShow = `${h%12 || 12}:${t[1]} ${h>=12?'PM':'AM'}`;
                    }
                } catch(e){}

                if(activeFilter === 'Live' && timeState !== 'live') return;
                if(activeFilter === 'Upcoming' && timeState !== 'upcoming') return;

                // *** JSON Structure Mapping (The Main Fix) ***
                let extractedId = '';
                if(ev.links && ev.links.includes('pro/')) {
                    extractedId = ev.links.split('pro/')[1].replace('.txt', '').trim();
                }

                let streamsHtml = '';
                // যদি Streams Object-এ ওই ID থাকে এবং তার ভেতর streams array থাকে
                if(extractedId && streamsData[extractedId] && streamsData[extractedId].streams) {
                    streamsData[extractedId].streams.forEach(s => {
                        if(s.link && s.link !== 'https://no.link') {
                            // |referer এর পরের অংশ বাদ দিয়ে ক্লিন লিংক নেওয়া
                            let cleanUrl = s.link.split('|')[0].trim();
                            streamsHtml += `<div class="stream-link" onclick="openPlayer('${cleanUrl}', '${s.name}', event)">${s.name}</div>`;
                        }
                    });
                }
                
                if(!streamsHtml) streamsHtml = '<div style="width:100%;text-align:center;color:#e74c3c;font-size:12px;">কোনো স্ট্রিম লিংক নেই</div>';

                // কার্ড তৈরি
                html += `
                    <div class="card" onclick="this.querySelector('.streams').style.display = this.querySelector('.streams').style.display === 'flex' ? 'none' : 'flex'">
                        <div class="card-title"><i class="fas fa-satellite-dish"></i> ${ev.category || 'Sports'} | ${ev.eventName}</div>
                        <div class="match-row">
                            <div class="team">
                                <img src="${ev.teamAFlag}" onerror="this.src='https://via.placeholder.com/45'">
                                <div class="team-name">${ev.teamAName}</div>
                            </div>
                            <div class="status">
                                ${timeState === 'live' 
                                    ? `<div class="status-btn status-live">${timeText}</div>` 
                                    : `<div class="time">${timeShow}</div>
                                       <div class="date">${ev.date}</div>
                                       <div class="status-btn">${timeText}</div>`
                                }
                            </div>
                            <div class="team">
                                <img src="${ev.teamBFlag}" onerror="this.src='https://via.placeholder.com/45'">
                                <div class="team-name">${ev.teamBName}</div>
                            </div>
                        </div>
                        <div class="streams">${streamsHtml}</div>
                    </div>
                `;
            });

            document.getElementById('events-container').innerHTML = html || '<div id="debug-log" style="color:#88929e;">কোনো ম্যাচ পাওয়া যায়নি</div>';
        }

        // ভিডিও প্লেয়ার লজিক
        function openPlayer(url, name, e) {
            e.stopPropagation();
            document.getElementById('player-title').innerText = name;
            document.getElementById('player-error').style.display = 'none';
            document.getElementById('player-modal').style.display = 'flex';
            
            const video = document.getElementById('video-element');
            if(hlsObj) { hlsObj.destroy(); hlsObj = null; }
            if(dashObj) { dashObj.reset(); dashObj = null; }
            video.src = '';

            try {
                if(url.includes('.mpd')) {
                    dashObj = dashjs.MediaPlayer().create();
                    dashObj.initialize(video, url, true);
                } else if(url.includes('.m3u8')) {
                    if(Hls.isSupported()) {
                        hlsObj = new Hls(); hlsObj.loadSource(url); hlsObj.attachMedia(video);
                    } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                    }
                } else {
                    video.src = url;
                }
            } catch(err) {
                document.getElementById('player-error').style.display = 'block';
                document.getElementById('player-error').innerText = "ভিডিও প্লে করতে সমস্যা হচ্ছে।";
            }
        }

        function closePlayer() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('video-element').pause();
            if(hlsObj) { hlsObj.destroy(); hlsObj = null; }
            if(dashObj) { dashObj.reset(); dashObj = null; }
        }

        // শুরু
        initApp();
    </script>
</body>
</html>

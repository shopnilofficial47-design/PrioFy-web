<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Header -->
    <header class="app-header">
        <div class="left-header">
            <i class="fas fa-bars"></i>
            <h2 class="logo"><i>priofy</i></h2>
        </div>
        <div class="right-header">
            <i class="fas fa-bell"></i>
            <i class="far fa-star"></i>
            <i class="fas fa-sync-alt" onclick="fetchData()"></i>
            <i class="fas fa-search"></i>
        </div>
    </header>

    <!-- Marquee Text -->
    <div class="ticker-wrap">
        <marquee>🌟 Enjoy sports, live events, and entertainment seamlessly!</marquee>
    </div>

    <!-- Categories Horizontal Scroll -->
    <div class="categories-container" id="categories-container">
        <!-- Categories will be injected by JS -->
    </div>

    <!-- Filters -->
    <div class="filters-container">
        <button class="filter-btn active" id="filter-all"><i class="fas fa-check"></i> All</button>
        <button class="filter-btn" id="filter-live">Live</button>
        <button class="filter-btn" id="filter-upcoming">Upcoming</button>
    </div>

    <!-- Main Events Container -->
    <main id="events-container">
        <!-- Loader -->
        <div class="loader" id="loader">ডেটা লোড হচ্ছে...</div>
    </main>

    <script src="app.js"></script>
</body>
</html>

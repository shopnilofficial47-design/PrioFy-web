<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priofy Sports</title>
    
    <!-- Player Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <script src="https://cdn.dashjs.org/v4.7.1/dash.all.min.js"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header (Priofy Style) -->
    <header class="app-header">
        <div class="left-header">
            <i class="fas fa-bars"></i>
            <h2 class="logo"><i>priofy</i></h2>
        </div>
        <div class="right-header">
            <i class="fas fa-bell"></i>
            <i class="far fa-star"></i>
            <i class="fas fa-sync-alt" onclick="fetchData()"></i>
            <i class="fas fa-search"></i>
        </div>
    </header>

    <!-- Ticker -->
    <div class="ticker-wrap">
        <marquee>🌟 Priofy better! Enjoy sports, live events, and entertainment seamlessly!</marquee>
    </div>

    <!-- Categories -->
    <div class="categories-container" id="categories-container"></div>

    <!-- Filters -->
    <div class="filters-container">
        <button class="filter-btn active" id="filter-all" onclick="setFilter('All', this)">✓ All</button>
        <button class="filter-btn" id="filter-live" onclick="setFilter('Live', this)">Live</button>
        <button class="filter-btn" id="filter-upcoming" onclick="setFilter('Upcoming', this)">Upcoming</button>
    </div>

    <!-- Main Content -->
    <main id="events-container">
        <div class="loader" id="loader">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            <p style="margin-top: 10px;">ডেটা লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item"><i class="fas fa-film"></i><span>Movies</span></div>
        <div class="nav-item"><i class="fas fa-tv"></i><span>TV Mode</span></div>
        <div class="nav-item active"><i class="fas fa-futbol"></i><span>Live Events</span></div>
        <div class="nav-item"><i class="fas fa-heart"></i><span>Favorite</span></div>
        <div class="nav-item"><i class="fas fa-satellite-dish"></i><span>Live TV</span></div>
    </nav>

    <!-- Video Player Modal -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="player-title">Live Stream</h3>
                <i class="fas fa-times close-btn" onclick="closePlayer()"></i>
            </div>
            <div class="video-wrapper">
                <video id="video-element" controls autoplay playsinline></video>
                <div id="player-error" class="player-error" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

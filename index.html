<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priofy Live Sports</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
  <!-- HLS Player Script -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo"><i>priofy</i></h1>
      <nav class="nav">
        <button class="nav-btn active" data-tab="events">লাইভ ম্যাচ</button>
        <button class="nav-btn" data-tab="channels">চ্যানেল</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="events-tab" class="tab-content active">
      <div class="filters">
        <button class="filter-btn active" data-category="all">সব</button>
        <button class="filter-btn" data-category="Cricket">ক্রিকেট</button>
        <button class="filter-btn" data-category="Football">ফুটবল</button>
        <button class="filter-btn" data-category="Basketball">বাস্কেটবল</button>
        <button class="filter-btn" data-category="Hockey">হকি</button>
        <button class="filter-btn" data-category="Motorsport">মোটরসপোর্ট</button>
        <button class="filter-btn" data-category="Boxing">বক্সিং/রেসলিং</button>
        <button class="filter-btn" data-category="Others">অন্যান্য</button>
      </div>
      <div id="events-list" class="events-grid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...</div>
      </div>
    </section>

    <section id="channels-tab" class="tab-content">
      <div id="channels-list" class="channels-grid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...</div>
      </div>
    </section>
  </main>

  <!-- Stream Modal with Player -->
  <div id="stream-modal" class="modal hidden">
    <div class="modal-content modal-player">
      <button class="modal-close" id="modal-close">&times;</button>
      <h2 id="modal-title">স্ট্রিম</h2>

      <div id="player-wrap" class="player-wrap hidden">
        <video id="video-player" controls playsinline></video>
        <div id="player-status" class="player-status"></div>
      </div>

      <div id="modal-links" class="stream-links"></div>
      <p class="modal-note">লিংক ক্লিক করলে প্লেয়ারে চলবে। না চললে VLC / MX Player এ লিংক ওপেন করুন।</p>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Priofy Sports • GitHub + Vercel</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>

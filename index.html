<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Stream Live</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">🏆 Sports Stream</h1>
      <nav class="nav">
        <button class="nav-btn active" data-tab="events">লাইভ ম্যাচ</button>
        <button class="nav-btn" data-tab="channels">চ্যানেল</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Events Tab -->
    <section id="events-tab" class="tab-content active">
      <div class="filters">
        <button class="filter-btn active" data-category="all">সব</button>
        <button class="filter-btn" data-category="Cricket">ক্রিকেট</button>
        <button class="filter-btn" data-category="Football">ফুটবল</button>
        <button class="filter-btn" data-category="Basketball">বাস্কেটবল</button>
        <button class="filter-btn" data-category="Hockey">হকি</button>
        <button class="filter-btn" data-category="Motorsport">মোটরসপোর্ট</button>
        <button class="filter-btn" data-category="Boxing">বক্সিং/রেসলিং</button>
        <button class="filter-btn" data-category="Others">অন্যান্য</button>
      </div>
      <div id="events-list" class="events-grid">
        <div class="loading">লোড হচ্ছে...</div>
      </div>
    </section>

    <!-- Channels Tab -->
    <section id="channels-tab" class="tab-content">
      <div id="channels-list" class="channels-grid">
        <div class="loading">লোড হচ্ছে...</div>
      </div>
    </section>
  </main>

  <!-- Stream Modal -->
  <div id="stream-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <h2 id="modal-title">স্ট্রিম লিংক</h2>
      <div id="modal-links" class="stream-links"></div>
      <p class="modal-note">নোট: কিছু লিংক ভিপিএন বা নির্দিষ্ট প্লেয়ার (VLC / MX Player) চাইতে পারে।</p>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Sports Stream • GitHub + Vercel • টেস্ট মোড</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
